    <style>
      .loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #333333;
        transition:
          opacity 0.75s,
          visibility 0.75s;
      }

      .loader--hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loader::after {
        content: "";
        width: 40px;
        height: 40px;
        border: 8px solid #dddddd;
        border-top-color: #1498cc;
        border-radius: 50%;
        animation: loading 0.75s ease infinite;
      }

      @keyframes loading {
        from {
          transform: rotate(0turn);
        }
        to {
          transform: rotate(1turn);
        }
      }
    </style>

    <script>
      // ===== Loading Screen =====
      window.addEventListener("load", () => {
        const loader = document.querySelector(".loader");
        loader.classList.add("loader--hidden");

        loader.addEventListener("transitionend", () => {
          document.body.removeChild(loader);
        });
      });

      // ===== Muat Pesan Karakter dari data/messages/ =====
      // Setiap <p class="character-message"> membaca pesannya dari
      // file yang tertera pada atribut data-message.
      document.querySelectorAll(".character-message").forEach((paragraph) => {
        const messageFile = paragraph.dataset.message;

        fetch("data/messages/" + messageFile)
          .then((response) => {
            if (!response.ok) {
              throw new Error("Gagal memuat " + messageFile);
            }
            return response.text();
          })
          .then((text) => {
            paragraph.textContent = text.trim();

            // Tinggi halaman bertambah setelah pesan tampil,
            // jadi progress bar dihitung ulang.
            if (window.refreshProgressBar) {
              window.refreshProgressBar();
            }
          })
          .catch((error) => {
            console.error(error);
            paragraph.textContent = "Pesan tidak dapat dimuat.";
          });
      });

      // ===== Blokir Klik Kanan & Pemilihan Teks =====
      document.addEventListener("contextmenu", function (e) {
        e.preventDefault();
      });

      document.addEventListener("selectstart", function (e) {
        e.preventDefault();
      });

      // ===== Smooth Scrolling =====
      document.addEventListener("click", function (e) {
        const anchor = e.target.closest('a[href^="#"]');

        if (!anchor || anchor.getAttribute("href") === "#") {
          return;
        }

        const target = document.querySelector(anchor.getAttribute("href"));

        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: "smooth" });
        }
      });

      // ===== Scroll Bar =====
      // Hitung tinggi dokumen setiap kali scroll/resize, karena
      // pesan karakter dimuat belakangan lewat fetch() sehingga
      // tinggi halaman bisa bertambah.
      (function () {
        const progress = document.getElementById("progressbar");

        if (!progress) {
          return;
        }

        function updateProgress() {
          const totalHeight =
            document.documentElement.scrollHeight - window.innerHeight;

          let progressHeight = 0;

          if (totalHeight > 0) {
            progressHeight = (window.scrollY / totalHeight) * 100;
          }

          // Batasi hasil di 0-100%
          progressHeight = Math.max(0, Math.min(100, progressHeight));
          progress.style.height = progressHeight + "%";
        }

        window.addEventListener("scroll", updateProgress, { passive: true });
        window.addEventListener("resize", updateProgress, { passive: true });
        window.addEventListener("load", updateProgress);

        // Inisialisasi untuk semua ukuran layar (desktop & mobile),
        // agar indikator langsung mengikuti dokumen utuh.
        updateProgress();

        // Sediakan agar dapat dipanggil ulang setelah fetch()
        // selesai memuat pesan.
        window.refreshProgressBar = updateProgress;

        // Hitung ulang setelah semua harga selesai dimuat.
        window.addEventListener("load", () => setTimeout(updateProgress, 300));
      })();
    </script>

    <script>
      // ===== Mobile Menu =====
      // Satu tombol untuk membuka/menutup daftar navigasi mobile.
      (function () {
        const toggle = document.getElementById("menu-toggle");
        const mobileNav = document.getElementById("mobile-nav");

        if (!toggle || !mobileNav) {
          return;
        }

        let savedScrollY = 0;

        function setMenu(open) {
          mobileNav.classList.toggle("is-open", open);
          toggle.classList.toggle("is-open", open);
          toggle.setAttribute("aria-expanded", String(open));
          toggle.setAttribute("aria-label", open ? "Tutup menu" : "Buka menu");

          // Scroll lock: simpan posisi scroll lalu kunci halaman.
          if (open) {
            savedScrollY = window.scrollY || window.pageYOffset;
            document.body.classList.add("menu-open");
            document.body.style.top = -savedScrollY + "px";
          } else {
            document.body.classList.remove("menu-open");
            document.body.style.top = "";
            window.scrollTo(0, savedScrollY);
          }
        }

        toggle.addEventListener("click", function () {
          setMenu(!mobileNav.classList.contains("is-open"));
        });

        // Menu tertutup otomatis setelah memilih halaman.
        mobileNav.querySelectorAll("a").forEach(function (link) {
          link.addEventListener("click", function () {
            setMenu(false);
          });
        });

        // Tutup menu jika layar diperbesar ke ukuran desktop.
        window.addEventListener("resize", function () {
          if (
            window.innerWidth > 768 &&
            mobileNav.classList.contains("is-open")
          ) {
            setMenu(false);
          }
        });
      })();
    </script>

    <script>
      // ===== Animasi pembuka Home =====
      // Seluruh animasi pembuka ("Happy" zoom-in, "Birthday" zoom-in, dan
      // typing teks bawah) DITAHAN sampai loading screen selesai memuat
      // halaman dan benar-benar menghilang. Sinkronisasi memakai satu
      // sinyal resmi dari loading.js: window.GiLoader.onDone().
      //
      // Urutan & durasi tetap sama seperti sebelumnya, hanya waktu
      // mulainya yang bergeser ke "setelah loading screen hilang":
      //   +0s    : belum ada teks
      //   +1.0s  : "Happy" zoom-in (1s)  -> delay 1s di home.css
      //   +2.5s  : "Birthday" zoom-in (1s) -> delay 2.5s di home.css
      //   +4.5s  : typing teks bawah (3s)
      (function () {
        const line = document.querySelector(".home-content .typing-line");
        const fullText = line ? line.textContent : "";
        const total = fullText.length;

        // Kosongkan teks lebih dulu (teks baru muncul saat typing).
        if (line) {
          line.textContent = "";
          line.classList.add("is-prepared");
        }

        const TYPING_START = 4500; // ms — setelah Happy + Birthday selesai
        const TYPING_DURATION = 3000; // ms

        function startTyping() {
          if (!line || !total) {
            return;
          }

          const step = TYPING_DURATION / total;

          setTimeout(function () {
            let index = 0;

            const timer = setInterval(function () {
              index++;
              line.textContent = fullText.slice(0, index);

              if (index >= total) {
                clearInterval(timer);
              }
            }, step);
          }, TYPING_START);
        }

        let introStarted = false;

        function beginIntro() {
          if (introStarted) {
            return;
          }
          introStarted = true;

          // Memicu animasi zoom "Happy" & "Birthday" (lihat home.css).
          document.documentElement.classList.add("gi-ready");

          startTyping();
        }

        if (window.GiLoader && typeof window.GiLoader.onDone === "function") {
          window.GiLoader.onDone(beginIntro);
          // Jaring pengaman: bila sinyal tidak pernah datang, tetap mulai.
          setTimeout(beginIntro, 12000);
        } else {
          // Tidak ada loading screen: mulai langsung, seperti perilaku lama.
          beginIntro();
        }
      })();
    </script>

    <script>
      // ===== Animasi scroll bagian karakter (gambar, nama, pesan) =====
      // Muncul : gambar 0.5s -> jeda 0.5s -> nama typing 0.5s
      //          -> jeda 0.5s -> pesan fade-in 0.5s
      //
      // Perilaku: setiap karakter muncul SATU KALI lalu tetap terlihat
      // permanen selama halaman Home masih terbuka. Sequence menghilang
      // tidak dipakai lagi, sehingga scroll melewati section atau kembali
      // ke atas tidak menyembunyikan elemen yang sudah tampil.
      //
      // Pemicu: sebuah karakter dianggap "tercapai" ketika titik tengah
      // viewport masuk ke sectionnya (sama seperti pemicu lama).
      // Pemeriksaan saat scroll menjamin tidak ada karakter yang terlewat
      // walaupun pengguna menggulir sangat cepat.
      (function () {
        const sections = Array.prototype.slice.call(
          document.querySelectorAll("section.about")
        );

        if (!sections.length) {
          return;
        }

        const STAGE = 500; // durasi tiap tahap (gambar/pesan/nama)
        const GAP = 500; // jeda antar tahap
        const NAME_START = STAGE + GAP; // 1000ms setelah mulai
        const MSG_START = NAME_START + STAGE + GAP; // 2000ms

        const items = sections.map(function (section) {
          const heading = section.querySelector("h1");
          let fullName = "";
          let live = null;

          if (heading) {
            fullName = heading.textContent.trim();

            // Dua lapisan: "space" menyimpan tinggi akhir (tersembunyi),
            // "live" adalah teks yang diketik. Ruang nama selalu tetap.
            heading.textContent = "";
            heading.classList.add("character-name");
            heading.setAttribute("aria-label", fullName);

            const space = document.createElement("span");
            space.className = "character-name-space";
            space.setAttribute("aria-hidden", "true");
            space.textContent = fullName;

            live = document.createElement("span");
            live.className = "character-name-live";

            heading.appendChild(space);
            heading.appendChild(live);
          }

          section.classList.add("character-anim");

          return {
            section: section,
            live: live,
            fullName: fullName,
            shown: false, // sudah pernah ditampilkan (permanen)
            timers: [],
            typing: null,
            top: undefined,
            height: 0,
          };
        });

        function clearTimers(item) {
          item.timers.forEach(function (id) {
            clearTimeout(id);
          });
          item.timers = [];

          if (item.typing !== null) {
            clearInterval(item.typing);
            item.typing = null;
          }
        }

        function later(item, fn, delay) {
          item.timers.push(setTimeout(fn, delay));
        }

        // Mengetik nama dari kiri ke kanan (0.5s).
        function typeName(item, done) {
          const el = item.live;

          if (item.typing !== null) {
            clearInterval(item.typing);
            item.typing = null;
          }

          if (!el) {
            if (done) done();
            return;
          }

          const chars = Array.from(item.fullName);
          el.textContent = "";

          if (!chars.length) {
            if (done) done();
            return;
          }

          const step = STAGE / chars.length;
          let count = 0;

          item.typing = setInterval(function () {
            count++;
            el.textContent = chars.slice(0, count).join("");

            if (count >= chars.length) {
              clearInterval(item.typing);
              item.typing = null;
              if (done) done();
            }
          }, step);
        }

        // Tampilkan karakter (urutan tetap: gambar -> nama -> pesan).
        // Hanya berjalan sekali per karakter; setelah itu permanen.
        function show(item) {
          if (item.shown) {
            return;
          }
          item.shown = true;

          clearTimers(item);

          // Tahap 1: gambar muncul (0.5s).
          item.section.classList.add("character-img-in");

          // Nama mulai dari kosong (ruangnya sudah dipesan lapisan space).
          if (item.live) {
            item.live.textContent = "";
          }

          // Tahap 2: nama typing, mulai 1s (0.5s + jeda 0.5s).
          later(item, function () {
            typeName(item);
          }, NAME_START);

          // Tahap 3: pesan fade-in, mulai 2s.
          later(item, function () {
            item.section.classList.add("character-msg-in");
          }, MSG_START);
        }

        // ---- Deteksi karakter yang sudah "tercapai" ----
        // Titik acuan: tengah viewport (sama seperti perilaku lama).
        // Mengukur ulang dilakukan saat halaman berubah ukuran (mis.
        // gambar atau pesan selesai dimuat dapat menggeser posisi section).
        let ticking = false;

        function measure() {
          const scrollY = window.scrollY || window.pageYOffset || 0;

          items.forEach(function (item) {
            const rect = item.section.getBoundingClientRect();
            item.top = rect.top + scrollY;
            item.height = rect.height;
          });
        }

        // Tampilkan setiap karakter yang belum pernah muncul dan sudah
        // terlewati (tengah viewport sudah mencapai awal section-nya).
        // Menjamin tidak ada karakter yang terlewat saat scroll cepat.
        function revealReached() {
          const line =
            (window.scrollY || window.pageYOffset || 0) +
            window.innerHeight / 2;

          items.forEach(function (item) {
            if (item.shown || item.top === undefined) {
              return;
            }

            if (line >= item.top) {
              show(item);
            }
          });
        }

        function update() {
          // Saat menu mobile terbuka, scroll dikunci (window.scrollY = 0),
          // jadi jangan hitung ulang agar state tidak salah.
          if (document.body.classList.contains("menu-open")) {
            return;
          }

          revealReached();
        }

        function onScroll() {
          if (ticking) {
            return;
          }

          ticking = true;
          window.requestAnimationFrame(function () {
            ticking = false;
            update();
          });
        }

        function refresh() {
          measure();
          update();
        }

        // Pemicu utama: IntersectionObserver. rootMargin "-50%" membuat
        // section dianggap menyentuh pemicu tepat ketika bagian atasnya
        // melewati tengah viewport (identik dengan titik acuan lama),
        // sehingga tetap akurat bila tata letak bergeser tanpa scroll.
        if ("IntersectionObserver" in window) {
          const observer = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                if (!entry.isIntersecting) {
                  return;
                }

                const item = items.find(function (candidate) {
                  return candidate.section === entry.target;
                });

                if (item) {
                  show(item);
                }
              });
            },
            { rootMargin: "0px 0px -50% 0px", threshold: 0 }
          );

          items.forEach(function (item) {
            observer.observe(item.section);
          });
        }

        window.addEventListener("scroll", onScroll, { passive: true });
        window.addEventListener("resize", refresh);
        window.addEventListener("load", refresh);
        window.addEventListener("orientationchange", refresh);

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(refresh);
        }

        if ("ResizeObserver" in window) {
          new ResizeObserver(refresh).observe(document.body);
        }

        // Sinkronkan state lagi setelah kunci scroll menu mobile dilepas.
        new MutationObserver(function () {
          if (!document.body.classList.contains("menu-open")) {
            refresh();
          }
        }).observe(document.body, {
          attributes: true,
          attributeFilter: ["class"],
        });

        measure();
        update();
      })();
    </script>
